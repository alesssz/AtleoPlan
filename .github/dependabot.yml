# Version updates for the GitHub Actions only, one grouped pull request a week.
# npm and Composer are updated by hand; their advisories are covered by
# Dependabot alerts and audit.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
