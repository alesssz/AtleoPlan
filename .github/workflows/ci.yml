# The checks of `make check`, plus the production build, on every push.
# main's ruleset requires both jobs by name: renaming one means updating it.
name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the branch's running check, except on main, where every
# merge keeps its run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Frontend and docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node scripts/docs-toc.mjs --check
        working-directory: .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Catches imports that resolve in Vitest but not in Vite's build
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tests' values come from phpunit.xml, which forces the test database
      - run: cp backend/.env.example backend/.env
      # The development image: the same PHP and extensions as locally
      - run: docker compose build backend
      # Its first start creates atleoplan_test (docker/postgres/init)
      - run: docker compose up -d --wait postgres
      - run: docker compose run --rm backend composer install --no-interaction --no-progress
      - run: docker compose run --rm backend php artisan key:generate
      - run: docker compose run --rm backend vendor/bin/pint --test
      - run: docker compose run --rm backend php artisan test
      - if: failure()
        run: docker compose logs --no-color
