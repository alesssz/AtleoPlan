# Fails on any advisory not reviewed and ignored (frontend/package.json
# auditIgnore, backend/composer.json config.audit.ignore). Unlike Dependabot
# alerts, it fails the branch that brings a vulnerable version, before merge.
# The outdated packages go to the run's summary and never fail it.
name: Audit

on:
  schedule:
    # A new advisory on a package that did not change
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches: ['**']
    paths: [frontend/package.json, frontend/package-lock.json, backend/composer.json, backend/composer.lock]
  # Forks only: no push of this repository covers them
  pull_request:
    paths: [frontend/package.json, frontend/package-lock.json, backend/composer.json, backend/composer.lock]

permissions:
  contents: read

jobs:
  npm:
    name: npm packages
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # npm outdated compares what is really resolved
      - uses: ./.github/actions/setup
      - name: Outdated packages (summary)
        working-directory: frontend
        # npm outdated exits 1 when anything is outdated
        run: |
          {
            echo '### Outdated npm packages'
            echo '```'
            npm outdated || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Audit
        run: node scripts/npm-audit.mjs

  composer:
    name: Composer packages
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Composer's own image with --locked reads composer.lock alone, without
      # the minutes of building the backend's image. It lacks the project's PHP
      # extensions (gd, exif…): without --ignore-platform-reqs, outdated
      # proposes only versions that would install there, not the latest
      - name: Outdated packages (summary)
        run: |
          {
            echo '### Outdated Composer packages'
            echo '```'
            docker run --rm -v "$PWD/backend:/app:ro" -w /app composer:2 composer outdated --direct --locked --ignore-platform-reqs || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Abandoned packages fail too (Composer's default)
      - name: Audit
        run: docker run --rm -v "$PWD/backend:/app:ro" -w /app composer:2 composer audit --locked
