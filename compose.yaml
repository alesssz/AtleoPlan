# The local development stack: the Laravel backend and its queue worker,
# Postgres and Mailpit. The React app runs on the computer with Vite, which
# forwards /api, /sanctum and /auth to the backend, so the browser sees one
# origin, as in production.
#
# Host ports are each service's standard port + 500, so they never clash with
# other projects: Laravel 8500, Postgres 5932, Mailpit 8525, Vite 5673. Each
# can be changed with a variable, e.g. `APP_PORT=8600 docker compose up -d`.
name: atleoplan

# Shared by the backend and the queue worker: same image, same code
x-backend: &backend
  build:
    context: .
    target: dev
  image: atleoplan-backend:dev
  volumes:
    - ./backend:/app
    # vendor/ in a named volume over the bind mount: reading a thousand package
    # files through the shared folder took over a second per request after a
    # pause, from the volume a tenth
    - vendor:/app/vendor
    # Composer copies the volume here after every change
    # (docker/php/sync-vendor.sh), so the editor still sees the packages
    - ./backend/vendor:/vendor-host
    - composer-cache:/composer-cache
  environment:
    # A real environment variable wins over backend/.env, so these hold
    # whatever a fresh .env says
    APP_NAME: AtleoPlan
    # The React app (Vite), for links in emails
    FRONTEND_URL: http://localhost:5673
    # Laravel's own port: Vite does not forward /admin
    ADMIN_URL: http://localhost:${APP_PORT:-8500}/admin
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: atleoplan
    DB_USERNAME: atleoplan
    DB_PASSWORD: atleoplan
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    # No Redis to run
    QUEUE_CONNECTION: database
    # Requests from this origin authenticate with the session cookie
    SANCTUM_STATEFUL_DOMAINS: localhost:5673
  depends_on:
    postgres:
      condition: service_healthy
    mailpit:
      condition: service_started

services:
  backend:
    <<: *backend
    ports:
      - "127.0.0.1:${APP_PORT:-8500}:8000"
    restart: unless-stopped

  # queue:listen reloads the code for every job, so changes apply without a
  # restart; production will use queue:work. Five minutes for a video.
  queue:
    <<: *backend
    command: ["php", "artisan", "queue:listen", "--tries=3", "--timeout=300"]
    # The image's healthcheck asks Caddy, which does not run in the worker
    healthcheck:
      disable: true
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: atleoplan
      POSTGRES_USER: atleoplan
      POSTGRES_PASSWORD: atleoplan
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5932}:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql
      - postgres-data:/var/lib/postgresql
      # Creates `atleoplan_test` on an empty volume
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atleoplan -d atleoplan"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Catches every email; nothing leaves the computer
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8525}:8025"
    restart: unless-stopped

volumes:
  postgres-data:
  # Starts empty: `make setup` fills it
  vendor:
  composer-cache:
