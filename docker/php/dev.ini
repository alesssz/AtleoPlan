; AtleoPlan — PHP settings for development, loaded after php.ini-development
; (copied in by the Dockerfile's `dev` target).

; A video can be up to 100 MB (docs/design/D2-decisions.md D2.5); the request around
; the file (form fields, multipart boundaries) needs a little more.
upload_max_filesize = 100M
post_max_size = 110M

; Resizing a large photo to WebP and its thumbnail holds the whole image in
; memory; the default 128M is tight for a 10 MB phone picture.
memory_limit = 512M

; PHP's own clock in UTC, like Laravel's: times are stored in UTC and shown
; in each user's time zone by the app.
date.timezone = UTC
