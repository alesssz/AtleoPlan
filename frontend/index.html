<!doctype html>
<!-- Dark is the default theme; the script below corrects it before the first paint -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: the app draws under the notch and home bar and
         keeps its controls clear with env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AtleoPlan: workout plans, sets and progress." />
    <!-- The dark theme's background; src/theme/theme.ts updates it with the theme -->
    <meta name="theme-color" content="#0B0B0F" />
    <title>AtleoPlan</title>
    <!--
      Applies the saved theme before React loads, so a light-theme user sees
      no dark flash. Must match src/theme/theme.ts (storage key and values).
      Blocked localStorage keeps the default.
    -->
    <script>
      try {
        var theme = localStorage.getItem('atleoplan.theme') || 'dark'
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      }
      catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
